<!doctype html>
<!--
  EDev-Vision | Minimal working example for the frontend (not the final site).

  Everything on this page is built from data/layers.json: the layer list, the
  time slider, legends, notes, credits and the assistant box. Copy the pieces
  you need. Language: plain HTML/CSS/JS + Leaflet, no build step, so it runs
  from GitHub Pages or by double-clicking the file.

  How switching is kept instant (the three rules worth copying):
   1. PRELOAD.   As soon as a layer is selected, all of its images are fetched
                 and decoded in the background, nearest dates first.
   2. SWAP LATE. The picture on the map is replaced only when the new one is
                 fully ready, so the map never goes blank between two frames.
   3. LATEST WINS. Every request carries a number; an answer that arrives
                 after a newer request was made is thrown away. Without this a
                 slow image can land on top of the one the user picked last.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okavango layers demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; display: grid;
         grid-template-columns: 320px 1fr; height: 100vh; }
  #side { overflow: auto; padding: 12px; border-right: 1px solid #ccc; }
  #map { height: 100vh; background: #e8e8e4; }
  h3 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; color: #555; }
  label { display: block; margin: 3px 0; cursor: pointer; }
  .note, .warn { font-size: 12px; color: #444; margin: 6px 0; }
  .warn { background: #fff4d6; padding: 6px; border-radius: 4px; }
  .sw { display: inline-block; width: 12px; height: 12px; margin-right: 6px;
        border: 1px solid #999; vertical-align: -2px; }
  input[type=range] { width: 100%; }
  #time { font-variant-numeric: tabular-nums; }
  #busy { color: #888; font-size: 12px; margin-left: 6px; visibility: hidden; }
  #chat textarea { width: 100%; box-sizing: border-box; }
  #answer { white-space: pre-wrap; margin-top: 6px; }
  /* DSWx draws "not water" in white: multiply makes white disappear. */
  .blend-multiply { mix-blend-mode: multiply; }
  /* A muted base map so blue/green classes stay readable on top of it. */
  .basemap { filter: grayscale(1) contrast(0.9) brightness(1.05); }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
                              #map { height: 55vh; order: 2; } }
</style>
</head>
<body>
<div id="side">
  <div id="layers"></div>
  <h3>Time</h3>
  <input id="slider" type="range" min="0" max="0" value="0">
  <div><span id="time"></span><span id="busy">loading…</span></div>
  <div id="flag" class="warn" hidden></div>
  <h3>Legend</h3>
  <div id="legend"></div>
  <div id="note" class="note"></div>
  <div id="source" class="note"></div>
  <h3>Ask the Delta</h3>
  <div id="chat">
    <textarea id="q" rows="2" placeholder="Why does the water shrink?"></textarea>
    <button id="ask">Ask</button>
    <div id="answer"></div>
    <div id="ailabel" class="note"></div>
  </div>
  <h3>Keep in mind</h3>
  <div id="must"></div>
</div>
<div id="map"></div>

<script>
// Works both from GitHub Pages and from a local copy of the repo.
const LOCAL = location.protocol === "file:" || location.hostname === "localhost";
const $ = (id) => document.getElementById(id);
const rgba = (c) => `rgba(${c[0]},${c[1]},${c[2]},${(c[3] ?? 255) / 255})`;

(async () => {
  const M = await (await fetch(LOCAL ? "data/layers.json"
      : "https://asadgnc.github.io/edev-data/data/layers.json")).json();
  const ROOT = LOCAL ? "data" : M.data_root;
  const abs = (u) => (u.startsWith("http") ? u : `${ROOT}/${u}`);
  const S = (await (await fetch(abs(M.credits))).json()).sources;

  const a = M.aoi;
  const map = L.map("map", { fadeAnimation: false })
      .fitBounds([[a.lat_min, a.lon_min], [a.lat_max, a.lon_max]]);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      { attribution: "&copy; OpenStreetMap contributors", className: "basemap" }).addTo(map);

  // ---- caches: every image and every bounds file is fetched exactly once ----
  const images = new Map();   // url -> Promise<url>, resolved when decoded
  const boundsCache = new Map();
  function preload(url) {
    if (!images.has(url)) {
      const img = new Image();
      img.src = url;
      // decode() resolves when the picture is ready to paint, not just downloaded.
      images.set(url, img.decode().then(() => url, () => url));
    }
    return images.get(url);
  }
  function bounds(url) {
    if (!boundsCache.has(url)) {
      boundsCache.set(url, fetch(url).then((r) => r.json()).then((b) => b.bounds));
    }
    return boundsCache.get(url);
  }

  // A layer's selectable times: an explicit list, or every day of a range.
  const timesCache = new Map();
  function times(l) {
    if (!timesCache.has(l.id)) {
      let out = l.times ?? [null];
      if (!l.times && l.time_range) {
        out = [];
        for (let d = new Date(l.time_range[0]); d <= new Date(l.time_range[1]);
             d.setUTCDate(d.getUTCDate() + 1)) out.push(d.toISOString().slice(0, 10));
      }
      timesCache.set(l.id, out);
    }
    return timesCache.get(l.id);
  }
  const urlOf = (l, t) => abs(l.url.replace("{time}", t));
  const boundsOf = (l, t) => abs(l.bounds.replace("{time}", t));

  // Fetch a whole image series in the background, nearest dates first,
  // three at a time so the frame the user is looking at is never starved.
  function warm(l, from = 0) {
    if (l.kind !== "image") return;
    const ts = times(l);
    const order = ts.map((t, i) => i).sort((x, y) => Math.abs(x - from) - Math.abs(y - from));
    let next = 0;
    const worker = async () => {
      while (next < order.length) {
        const t = ts[order[next++]];
        await Promise.all([preload(urlOf(l, t)), bounds(boundsOf(l, t))]);
      }
    };
    for (let i = 0; i < 3; i++) worker();
  }

  let layer = M.layers.find((l) => l.default) ?? M.layers[0];
  let shown = null;        // what is on the map right now
  let shownLayerId = null;
  let request = 0;         // rule 3: latest wins
  let busyTimer = null;

  async function show() {
    const mine = ++request;
    const l = layer, ts = times(l);
    const i = Math.min(+$("slider").value, ts.length - 1), t = ts[i];

    // The label follows the slider at once; the picture follows when ready.
    $("time").textContent = t ?? "(one image, no time)";
    const flagged = (l.flag_times ?? []).includes(t);
    $("flag").hidden = !flagged;
    $("flag").textContent = flagged ? l.flag_label : "";
    clearTimeout(busyTimer);
    busyTimer = setTimeout(() => { $("busy").style.visibility = "visible"; }, 150);
    const done = () => { clearTimeout(busyTimer); $("busy").style.visibility = "hidden"; };

    if (l.kind === "image") {
      const [url, b] = await Promise.all([preload(urlOf(l, t)), bounds(boundsOf(l, t))]);
      if (mine !== request) return;              // a newer choice exists
      if (shown && shownLayerId === l.id && shown.setUrl) {
        shown.setUrl(url);                       // same layer, new date: reuse the element
        shown.setBounds(b);
      } else {
        const next = L.imageOverlay(url, b, { opacity: l.opacity }).addTo(map);
        if (shown) map.removeLayer(shown);
        shown = next;
      }
      shownLayerId = l.id;
      done();
    } else {
      // Tiles come live from NASA: add the new layer UNDER the old one's place
      // invisibly, and swap only when its tiles have arrived (rule 2).
      const next = L.tileLayer(urlOf(l, t), { maxNativeZoom: l.max_native_zoom,
          opacity: 0, attribution: "NASA GIBS", keepBuffer: 4,
          className: l.blend ? `blend-${l.blend}` : "" }).addTo(map);
      const swap = () => {
        if (mine !== request) { map.removeLayer(next); return; }
        next.setOpacity(l.opacity);
        if (shown) map.removeLayer(shown);
        shown = next;
        shownLayerId = l.id;
        done();
      };
      let fired = false;
      const once = () => { if (!fired) { fired = true; swap(); } };
      next.once("load", once);
      setTimeout(once, 6000);                    // never hang on a missing tile
    }
  }

  function select(l) {
    layer = l;
    const ts = times(l);
    $("slider").max = ts.length - 1;
    $("slider").value = 0;
    $("slider").disabled = ts.length < 2;
    $("legend").innerHTML = (l.legend ?? []).map((g) =>
        `<div><span class="sw" style="background:${rgba(g.color)}"></span>${g.label}</div>`).join("");
    $("note").textContent = l.note ?? "";
    const s = S.find((x) => x.id === l.source);
    $("source").innerHTML = s ? `Source: <a href="${s.url}" target="_blank" rel="noopener">${s.name}</a> — ${s.provider}` : "";
    show();
    warm(l, 0);
  }

  // Layer list, grouped. Hovering a layer starts loading its first frame, so
  // by the time it is clicked the picture is usually already there.
  for (const g of [...new Set(M.layers.map((l) => l.group))]) {
    $("layers").insertAdjacentHTML("beforeend", `<h3>${g}</h3>`);
    for (const l of M.layers.filter((x) => x.group === g)) {
      const el = document.createElement("label");
      el.innerHTML = `<input type="radio" name="layer" ${l === layer ? "checked" : ""}> ${l.title}`;
      el.querySelector("input").onchange = () => select(l);
      el.onpointerenter = () => {
        if (l.kind === "image") { preload(urlOf(l, times(l)[0])); bounds(boundsOf(l, times(l)[0])); }
      };
      $("layers").append(el);
    }
  }

  // Images are preloaded, so they follow the slider on every step. Live tiles
  // are requested from NASA, so wait until the slider rests for a moment.
  let tileTimer = null;
  $("slider").oninput = () => {
    if (layer.kind === "image") return show();
    const ts = times(layer);
    $("time").textContent = ts[Math.min(+$("slider").value, ts.length - 1)];
    clearTimeout(tileTimer);
    tileTimer = setTimeout(show, 180);
  };

  $("must").innerHTML = M.must_show.map((m) => `<div class="warn">${m}</div>`).join("");
  $("ailabel").textContent = M.assistant.label;
  select(layer);
  // Once the default layer is in, quietly fetch the first frame of the others.
  setTimeout(() => M.layers.filter((l) => l.kind === "image" && l !== layer)
      .forEach((l) => { preload(urlOf(l, times(l)[0])); bounds(boundsOf(l, times(l)[0])); }), 1500);

  // Assistant: keep the history short, lock the button while waiting.
  const history = [];
  $("ask").onclick = async () => {
    const q = $("q").value.trim();
    if (!q) return;
    $("ask").disabled = true;
    $("answer").textContent = "…";
    history.push({ role: "user", content: q.slice(0, 800) });
    try {
      const r = await fetch(M.assistant.url, { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-9) }) });
      const d = await r.json();
      $("answer").textContent = d.answer ?? d.error;
      if (d.answer) history.push({ role: "assistant", content: d.answer.slice(0, 800) });
      else history.pop();
    } catch (e) {
      $("answer").textContent = "Assistant unreachable.";
      history.pop();
    }
    $("ask").disabled = false;
  };
})();
</script>
</body>
</html>
